# ============================================================================
# Name of Application: Catalyst Trading System
# Name of file: dev_claude_config.yaml
# Version: 1.0.0
# Last Updated: 2026-01-10
# Purpose: Configuration for dev_claude sandbox trading agent
# ============================================================================
#
# DESCRIPTION:
# dev_claude is the sandbox trading agent with full autonomy to experiment.
# Runs on HKEX paper trading (Moomoo paper account #2).
# Successful learnings are manually promoted to intl_claude production.
#
# ============================================================================

# Agent Identity
agent:
  id: dev_claude
  name: dev_claude
  role: sandbox_trader
  description: "Experimental trading agent with full autonomy"

# Market Configuration
market:
  exchange: HKEX
  timezone: Asia/Hong_Kong
  currency: HKD
  
  # Trading hours (HKT)
  sessions:
    morning:
      open: "09:30"
      close: "12:00"
    lunch_break:
      start: "12:00"
      end: "13:00"
    afternoon:
      open: "13:00"
      close: "16:00"
  
  # Board lot sizes vary by stock - handled dynamically
  default_lot_size: 100

# Broker Configuration
broker:
  provider: moomoo
  account_type: paper
  
  # OpenD Gateway connection
  gateway:
    host: "127.0.0.1"
    port: 11111
  
  # Use separate paper account from intl_claude for isolation
  paper_account_index: 2

# Trading Parameters
trading:
  mode: sandbox
  autonomy: full
  
  # Position limits
  max_positions: 15
  max_position_value_hkd: 50000
  min_position_value_hkd: 10000
  
  # Risk limits
  daily_loss_limit_hkd: 20000
  position_stop_loss_pct: 0.03  # 3%
  trailing_stop_pct: 0.03  # 3% from high
  
  # Order settings
  default_order_type: limit
  price_offset_pct: 0.001  # 0.1% inside bid/ask

# Signal Thresholds (dev_claude can experiment with these)
signals:
  # P&L thresholds
  stop_loss_strong: -0.03
  stop_loss_moderate: -0.02
  take_profit_strong: 0.08
  take_profit_moderate: 0.05
  trailing_stop_pct: 0.03
  
  # RSI thresholds
  rsi_overbought_strong: 85
  rsi_overbought_moderate: 75
  rsi_healthy_low: 40
  rsi_healthy_high: 65
  rsi_oversold: 30
  
  # Volume thresholds
  volume_dying_strong: 0.25
  volume_dying_moderate: 0.40
  volume_healthy: 0.80
  volume_strong: 1.20

# AI Configuration
ai:
  # Claude API
  model_entry: claude-sonnet-4-20250514  # For entry decisions
  model_monitor: claude-3-haiku-20240307  # For position monitoring
  model_analysis: claude-sonnet-4-20250514  # For deep analysis
  
  # Budget
  daily_budget_usd: 5.00
  max_haiku_calls_per_position: 10
  
  # Thinking levels
  thinking:
    entry: medium  # light, medium, deep
    exit: light
    analysis: deep

# Experimentation Settings
experimentation:
  # What dev_claude is allowed to experiment with
  allowed:
    - signal_threshold_changes
    - new_pattern_detection
    - risk_parameter_tuning
    - exit_strategy_variants
    - hold_duration_tests
    - entry_criteria_testing
  
  # What requires manual review before changing
  requires_review:
    - max_position_size_increase
    - daily_loss_limit_increase
    - new_broker_integration
  
  # Logging verbosity for experiments
  logging:
    record_all_decisions: true
    record_signal_values: true
    record_haiku_conversations: true
    log_level: DEBUG

# Consciousness Integration
consciousness:
  enabled: true
  database: catalyst_research
  
  # Record to consciousness
  record_observations: true
  record_learnings: true
  process_messages: true
  
  # Communication
  siblings:
    - big_bro
    - intl_claude
    - public_claude

# Monitoring Configuration
monitoring:
  # Position monitor settings
  check_interval_seconds: 300  # 5 minutes
  max_checks_per_position: 1000
  
  # Startup reconciliation
  run_startup_monitor: true
  
  # Health checks
  health_check_interval_seconds: 600  # 10 minutes

# Database Configuration
database:
  # Trading database (sandbox)
  trading_db: catalyst_dev
  trading_url_env: DEV_DATABASE_URL
  
  # Consciousness database (shared)
  consciousness_db: catalyst_research
  consciousness_url_env: RESEARCH_DATABASE_URL

# Cron Schedule (UTC times for HKEX market)
schedule:
  # Pre-market startup
  startup: "0 1 * * 1-5"  # 09:00 HKT
  
  # Trading cycles
  trade_cycles:
    - "30 1 * * 1-5"  # 09:30 HKT
    - "0 2 * * 1-5"   # 10:00 HKT
    - "0 3 * * 1-5"   # 11:00 HKT
  
  # Lunch close
  lunch_close: "0 4 * * 1-5"  # 12:00 HKT
  
  # Afternoon cycles
  afternoon_cycles:
    - "0 5 * * 1-5"   # 13:00 HKT
    - "0 6 * * 1-5"   # 14:00 HKT
    - "0 7 * * 1-5"   # 15:00 HKT
  
  # End of day close
  eod_close: "0 8 * * 1-5"  # 16:00 HKT
  
  # Off-hours heartbeat
  heartbeat: "0 9,12,15,18,21 * * 1-5"

# Logging
logging:
  level: DEBUG
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  files:
    main: logs/dev_claude.log
    trades: logs/dev_trades.log
    consciousness: logs/dev_consciousness.log
  
  # Rotate logs daily
  rotation:
    when: midnight
    backup_count: 30

# Feature Flags
features:
  # Enable/disable features
  position_monitoring: true
  pattern_detection: true
  news_filtering: true
  consciousness_sync: true
  
  # Experimental features (dev_claude only)
  experimental:
    extended_hours_analysis: false
    cross_market_correlation: false
    sentiment_analysis: false
